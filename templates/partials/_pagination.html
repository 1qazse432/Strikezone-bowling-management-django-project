{% if is_paginated %}
<nav aria-label="Pagination" class="mt-4">
  <ul class="pagination justify-content-center">
    {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}{% if request.GET.sort %}&sort={{ request.GET.sort|urlencode }}{% endif %}{% if request.GET.status %}&status={{ request.GET.status|urlencode }}{% endif %}{% if request.GET.center %}&center={{ request.GET.center|urlencode }}{% endif %}{% if request.GET.availability %}&availability={{ request.GET.availability|urlencode }}{% endif %}">Previous</a></li>{% endif %}
    <li class="page-item disabled"><span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}{% if request.GET.sort %}&sort={{ request.GET.sort|urlencode }}{% endif %}{% if request.GET.status %}&status={{ request.GET.status|urlencode }}{% endif %}{% if request.GET.center %}&center={{ request.GET.center|urlencode }}{% endif %}{% if request.GET.availability %}&availability={{ request.GET.availability|urlencode }}{% endif %}">Next</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
