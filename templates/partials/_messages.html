{% if messages %}
  <div class="message-stack" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
      <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss message"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
